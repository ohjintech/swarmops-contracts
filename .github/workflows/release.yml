name: release
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  go-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag nested Go module
        run: |
          git tag "gen/go/${GITHUB_REF_NAME}"
          git push origin "gen/go/${GITHUB_REF_NAME}"

  npm:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gen/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@swarmops"
      - run: npm ci
      - run: npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
      - run: npm run build
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Build wheel
        working-directory: gen/python
        run: |
          sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" pyproject.toml
          uv build
      - uses: softprops/action-gh-release@v2
        with:
          files: gen/python/dist/*
