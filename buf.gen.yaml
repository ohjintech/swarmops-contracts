# Remote plugins run on the Buf Schema Registry, so no local protoc/plugins are needed.
version: v2
clean: false
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/swarm-ops/swarmops-contracts/gen/go
plugins:
  # Go: messages, Connect handlers (control API), gRPC client (planner).
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.18.1
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: gen/go
    opt: paths=source_relative

  # TypeScript (protobuf-es v2; service descriptors work with connect-es v2).
  - remote: buf.build/bufbuild/es:v2.5.2
    out: gen/ts/src
    opt:
      - target=ts
      - import_extension=js

  # Python: messages, type stubs, gRPC server (planner).
  - remote: buf.build/protocolbuffers/python:v31.1
    out: gen/python/src
  - remote: buf.build/protocolbuffers/pyi:v31.1
    out: gen/python/src
  - remote: buf.build/grpc/python:v1.73.0
    out: gen/python/src
