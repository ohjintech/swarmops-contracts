[project]
name = "swarmops-contracts"
version = "0.1.0"
description = "Generated protobuf + gRPC Python code for SwarmOps"
requires-python = ">=3.12"
dependencies = [
  # Must be >= the runtime version the generated *_pb2.py files validate against.
  "protobuf>=6.31.1,<7",
  "grpcio>=1.73.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/swarmops"]
